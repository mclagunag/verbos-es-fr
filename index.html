<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 verbos español - francés</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}

header {
  background: #2c3e50;
  color: white;
  padding: 20px;
  text-align: center;
}

input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.verb {
  background: white;
  margin: 8px 0;
  padding: 12px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.es {
  font-weight: bold;
}

.fr {
  color: #555;
}

button {
  border: none;
  background: #eee;
  border-radius: 6px;
  cursor: pointer;
  padding: 6px 10px;
}

button:hover {
  background: #ddd;
}
</style>
</head>

<body>

<header>
<h1>100 verbos básicos</h1>
<p>Español → Francés</p>
<input type="text" id="search" placeholder="Buscar verbo...">
</header>

<div class="container" id="list">

<!-- VERBOS -->
<script>
const verbs = [
["ser","être"],["estar","être"],["tener","avoir"],["hacer","faire"],["poder","pouvoir"],
["decir","dire"],["ir","aller"],["ver","voir"],["dar","donner"],["saber","savoir"],
["querer","vouloir"],["llegar","arriver"],["pasar","passer"],["deber","devoir"],["poner","mettre"],
["parecer","sembler"],["quedar","rester"],["creer","croire"],["hablar","parler"],["llevar","porter"],
["dejar","laisser"],["seguir","suivre"],["encontrar","trouver"],["llamar","appeler"],["venir","venir"],
["pensar","penser"],["salir","sortir"],["volver","revenir"],["tomar","prendre"],["conocer","connaître"],
["vivir","vivre"],["sentir","sentir"],["tratar","traiter"],["mirar","regarder"],["contar","compter"],
["empezar","commencer"],["esperar","espérer"],["buscar","chercher"],["existir","exister"],["entrar","entrer"],
["trabajar","travailler"],["escribir","écrire"],["perder","perdre"],["producir","produire"],["ocurrir","arriver"],
["entender","comprendre"],["pedir","demander"],["recibir","recevoir"],["recordar","se souvenir"],["terminar","finir"],
["permitir","permettre"],["aparecer","apparaître"],["conseguir","obtenir"],["comenzar","commencer"],["servir","servir"],
["sacar","sortir"],["necesitar","avoir besoin"],["mantener","maintenir"],["resultar","résulter"],["leer","lire"],
["caer","tomber"],["cambiar","changer"],["presentar","présenter"],["crear","créer"],["abrir","ouvrir"],
["considerar","considérer"],["oír","entendre"],["acabar","terminer"],["convertir","convertir"],["ganar","gagner"],
["formar","former"],["traer","apporter"],["partir","partir"],["morir","mourir"],["aceptar","accepter"],
["realizar","réaliser"],["suponer","supposer"],["comprender","comprendre"],["lograr","réussir"],["explicar","expliquer"],
["preguntar","demander"],["tocar","toucher"],["reconocer","reconnaître"],["estudiar","étudier"],["alcanzar","atteindre"],
["nacer","naître"],["dirigir","diriger"],["correr","courir"],["utilizar","utiliser"],["pagar","payer"],
["ayudar","aider"],["gustar","plaire"],["jugar","jouer"],["escuchar","écouter"],["viajar","voyager"]
];

const container = document.getElementById("list");

verbs.forEach(v => {
  const div = document.createElement("div");
  div.className = "verb";
  div.innerHTML = `
    <span class="es">${v[0]}</span>
    <span class="fr">${v[1]}</span>
    <button onclick="playAudio('${v[1]}')">🔊</button>
  `;
  container.appendChild(div);
});

// búsqueda
document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();
  document.querySelectorAll(".verb").forEach(v => {
    v.style.display = v.innerText.toLowerCase().includes(value) ? "flex" : "none";
  });
});

// audio
function playAudio(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "fr-FR";
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}
</script>

</div>

</body>
</html>
