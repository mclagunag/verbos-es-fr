<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards ES-FR</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
  text-align: center;
}

header {
  background: #2c3e50;
  color: white;
  padding: 20px;
}

.container {
  padding: 20px;
}

button {
  margin: 5px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.primary { background: #3498db; color: white; }
.secondary { background: #ecf0f1; }

.card {
  width: 300px;
  height: 180px;
  margin: 30px auto;
  perspective: 1000px;
}

.inner {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.flipped {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  backface-visibility: hidden;
}

.back {
  transform: rotateY(180deg);
  background: #3498db;
  color: white;
}

.hidden { display: none; }

.list .verb {
  background: white;
  margin: 8px auto;
  padding: 10px;
  border-radius: 8px;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
}

input {
  padding: 10px;
  width: 80%;
  max-width: 400px;
  margin: 10px;
}
</style>
</head>

<body>

<header>
<h1>Flashcards ES → FR</h1>

<button class="primary" onclick="showFlashcards()">Flashcards</button>
<button class="secondary" onclick="showList()">Lista</button>

<br>
<input id="search" placeholder="Buscar..." oninput="filterList()">
</header>

<div class="container">

<!-- FLASHCARD -->
<div id="flashcardMode">
  <div class="card" onclick="flipCard()">
    <div id="cardInner" class="inner">
      <div class="face" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>

  <button onclick="prevCard()">⬅️</button>
  <button onclick="nextCard()">➡️</button>
  <button onclick="randomCard()">🔀</button>
</div>

<!-- LISTA -->
<div id="listMode" class="list hidden"></div>

</div>

<script>
const verbs = [
["ser","être"],["estar","être"],["tener","avoir"],["hacer","faire"],["poder","pouvoir"],
["decir","dire"],["ir","aller"],["ver","voir"],["dar","donner"],["saber","savoir"],
["querer","vouloir"],["llegar","arriver"],["pasar","passer"],["deber","devoir"],["poner","mettre"],
["parecer","sembler"],["quedar","rester"],["creer","croire"],["hablar","parler"],["llevar","porter"],
["dejar","laisser"],["seguir","suivre"],["encontrar","trouver"],["llamar","appeler"],["venir","venir"],
["pensar","penser"],["salir","sortir"],["volver","revenir"],["tomar","prendre"],["conocer","connaître"],
["vivir","vivre"],["sentir","sentir"],["tratar","traiter"],["mirar","regarder"],["contar","compter"],
["empezar","commencer"],["esperar","espérer"],["buscar","chercher"],["existir","exister"],["entrar","entrer"],
["trabajar","travailler"],["escribir","écrire"],["perder","perdre"],["producir","produire"],["ocurrir","arriver"],
["entender","comprendre"],["pedir","demander"],["recibir","recevoir"],["recordar","se souvenir"],["terminar","finir"],
["permitir","permettre"],["aparecer","apparaître"],["conseguir","obtenir"],["comenzar","commencer"],["servir","servir"],
["sacar","sortir"],["necesitar","avoir besoin"],["mantener","maintenir"],["resultar","résulter"],["leer","lire"],
["caer","tomber"],["cambiar","changer"],["presentar","présenter"],["crear","créer"],["abrir","ouvrir"],
["considerar","considérer"],["oír","entendre"],["acabar","terminer"],["convertir","convertir"],["ganar","gagner"],
["formar","former"],["traer","apporter"],["partir","partir"],["morir","mourir"],["aceptar","accepter"],
["realizar","réaliser"],["suponer","supposer"],["comprender","comprendre"],["lograr","réussir"],["explicar","expliquer"],
["preguntar","demander"],["tocar","toucher"],["reconocer","reconnaître"],["estudiar","étudier"],["alcanzar","atteindre"],
["nacer","naître"],["dirigir","diriger"],["correr","courir"],["utilizar","utiliser"],["pagar","payer"],
["ayudar","aider"],["gustar","plaire"],["jugar","jouer"],["escuchar","écouter"],["viajar","voyager"]
];

let current = 0;
let flipped = false;

function updateCard() {
  document.getElementById("front").innerText = verbs[current][0];
  document.getElementById("back").innerText = verbs[current][1];
  document.getElementById("cardInner").classList.remove("flipped");
  flipped = false;
}

function flipCard() {
  document.getElementById("cardInner").classList.toggle("flipped");
  flipped = !flipped;
}

function nextCard() {
  current = (current + 1) % verbs.length;
  updateCard();
}

function prevCard() {
  current = (current - 1 + verbs.length) % verbs.length;
  updateCard();
}

function randomCard() {
  current = Math.floor(Math.random() * verbs.length);
  updateCard();
}

function showFlashcards() {
  document.getElementById("flashcardMode").classList.remove("hidden");
  document.getElementById("listMode").classList.add("hidden");
}

function showList() {
  document.getElementById("flashcardMode").classList.add("hidden");
  document.getElementById("listMode").classList.remove("hidden");
}

function renderList() {
  const container = document.getElementById("listMode");
  container.innerHTML = "";
  verbs.forEach(v => {
    const div = document.createElement("div");
    div.className = "verb";
    div.innerHTML = `<span>${v[0]}</span><span>${v[1]}</span>`;
    container.appendChild(div);
  });
}

function filterList() {
  const value = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".verb").forEach(v => {
    v.style.display = v.innerText.toLowerCase().includes(value) ? "flex" : "none";
  });
}

updateCard();
renderList();
</script>

</body>
</html>
